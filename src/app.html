<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	
    <!-- cards and shit -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lemonfoxmere.com/">
    <meta property="og:title" content="Lemon Foxmere">
    <meta property="og:description" content="Robotics & RL Researcher @ UCSC">
    <meta property="og:image" content="https://lemonfoxmere.com/images/raster/banner.jpg">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:creator" content="@LemonFoxmere">
    <meta property="twitter:creator:id" content="@LemonFoxmere">
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lemon Foxmere" />
    <meta name="twitter:description" content="Robotics & RL Researcher @ UCSC" />
    <meta name="twitter:image" content="https://lemonfoxmere.com/images/raster/banner.jpg" />
    <meta name="twitter:site" content="@LemonFoxmere" />
    
    <!-- default favicon -->
    <link rel="icon" href="%sveltekit.assets%/assets/favicon_light.png" type="image/x-icon">
	
    <meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- global stylesheets -->
	<link rel="stylesheet" href="%sveltekit.assets%/stylesheets/guideline.css">
	<link rel="stylesheet" href="%sveltekit.assets%/stylesheets/global.css">
	<link rel="stylesheet" href="%sveltekit.assets%/stylesheets/fonts.css">

	<!-- detect non-safari mobile browsers -->
	<script>
		(function () {
			let ua = navigator.userAgent;
			let ios = /iPhone|iPod/.test(ua);
			let safari = /Version\/[\d.]+.*Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
			if (ios && !safari) document.documentElement.classList.add("ios-non-safari");
		})();
	</script>

	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
	<div style="display: contents; width: 100%; height: 100%">%sveltekit.body%</div>
</body>
</html>
